name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['manifest.json', '**.md']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.0.1). Leave blank to just build.'
        required: false

permissions:
  contents: write

env:
  PLUGIN_DIR: Jellyfin.Plugin.BulkMetadata
  TARGET_ABI: 10.10.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"; RELEASE=true
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"; RELEASE=true
          else
            V="$(grep -oP '(?<=<AssemblyVersion>)[^<]+' $PLUGIN_DIR/*.csproj)"; RELEASE=false
          fi
          V="${V#v}"
          # Jellyfin wants four-part versions
          while [[ "$(echo "$V" | tr -cd '.' | wc -c)" -lt 3 ]]; do V="$V.0"; done
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $V (release: $RELEASE)"

      - name: Build
        run: dotnet publish $PLUGIN_DIR --configuration Release --output out -p:Version=${{ steps.ver.outputs.version }} -p:AssemblyVersion=${{ steps.ver.outputs.version }} -p:FileVersion=${{ steps.ver.outputs.version }}

      - name: Package
        id: pkg
        shell: bash
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p pkg
          cp out/Jellyfin.Plugin.BulkMetadata.dll pkg/
          cat > pkg/meta.json <<JSON
          {
            "category": "Metadata",
            "changelog": "See https://github.com/${{ github.repository }}/releases",
            "description": "Bulk edit metadata across all of your libraries, with preview, undo and CSV import/export.",
            "guid": "52153ac0-2dcf-4319-a322-9c9415665d48",
            "name": "Bulk Metadata Editor",
            "overview": "Bulk edit metadata across all of your libraries",
            "owner": "justhallwest-commits",
            "targetAbi": "${TARGET_ABI}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "$V",
            "status": "Active",
            "autoUpdate": true,
            "imagePath": "",
            "assemblies": []
          }
          JSON
          ZIP="bulk-metadata-editor_${V}.zip"
          (cd pkg && zip -q -r "../$ZIP" .)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.zip }}
          path: ${{ steps.pkg.outputs.zip }}

      - name: Create GitHub release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${{ steps.pkg.outputs.zip }}" --title "Bulk Metadata Editor $TAG" --notes "Install via the plugin repository: https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json" --target "${GITHUB_SHA}"
          else
            gh release upload "$TAG" "${{ steps.pkg.outputs.zip }}" --clobber
          fi

      - name: Update manifest.json
        if: steps.ver.outputs.release == 'true'
        shell: bash
        run: |
          V=${{ steps.ver.outputs.version }}
          URL="https://github.com/${{ github.repository }}/releases/download/v${V}/${{ steps.pkg.outputs.zip }}"
          git fetch origin main
          git checkout -B main origin/main
          python3 .github/scripts/update_manifest.py "$V" "$URL" "${{ steps.pkg.outputs.md5 }}" "$TARGET_ABI" "Release $V"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish $V to manifest [skip ci]" || echo "manifest unchanged"
          git push origin main
